[project]
name = "ai-film-pipeline"
version = "0.0.0"
description = "Lean local-first AI film production pipeline"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "jsonschema>=4,<5", "Pillow>=10,<13"]

[project.scripts]
afp-film = "film_pipeline.cli:main"

[project.optional-dependencies]
flow = ["patchright>=1,<2", "playwright>=1,<2", "Pillow>=10,<13"]
qc = ["opencv-python-headless>=4.9,<5", "numpy>=1.26"]
provenance = ["c2pa-python==0.38.0", "cryptography>=42"]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"film_pipeline" = [
    "providers/*.json",
    "providers/registry/*.json",
    "providers/_flow_ui/*.py",
    "production/data/*.json",
    "film_package_export/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
